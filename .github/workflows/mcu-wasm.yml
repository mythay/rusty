# FORK(no_std): verifies the WAMR/MCU build path of libs/stdlib, and produces the SDK
# artifacts. A manual run with a `version` input also publishes everything as a GitHub
# release, including the downstream toolchain bundle (rusty-x86_64-windows.tar.gz).

name: MCU (WAMR) Build

on:
  push:
    branches: ["release/[0-9]*"]
  pull_request:
    branches: ["release/[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. v1.0.6-mcu.1); leave empty for a verification-only run"
        required: false
        type: string

jobs:
  build:
    name: wasm32-unknown-unknown (mcu-wamr)
    runs-on: ubuntu-latest
    env:
      # The stdlib's build dependency compiles the IEC compiler for the host, so an
      # LLVM 21 installation must be reachable (LLVM_SYS_211_PREFIX or PATH).
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libpolly-21-dev

      - name: Build the stdlib for WAMR
        working-directory: libs/stdlib
        run: cargo mcu-release

      - name: Build the stdlib for WAMR (debug)
        working-directory: libs/stdlib
        run: cargo mcu-debug

      - name: Build the wasm-only Linux compiler
        run: cargo build --release --features plc-compiler/wasm-only

      - name: Rename the Linux compiler
        run: cp target/release/plc plc-linux-x86_64

      - name: Upload libiec61131std.a
        uses: actions/upload-artifact@v4
        with:
          name: libiec61131std.a
          path: target/wasm32-unknown-unknown/release/libiec61131std.a

      - name: Upload libiec61131std-debug.a
        uses: actions/upload-artifact@v4
        with:
          name: libiec61131std-debug.a
          path: target/wasm32-unknown-unknown/debug/libiec61131std.a

      - name: Upload iec61131std.wasm
        uses: actions/upload-artifact@v4
        with:
          name: iec61131std.wasm
          path: target/wasm32-unknown-unknown/release/iec61131std.wasm

      - name: Upload plc-linux-x86_64
        uses: actions/upload-artifact@v4
        with:
          name: plc-linux-x86_64
          path: plc-linux-x86_64

  plc-exe:
    name: plc.exe (wasm-only, windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install LLVM
        shell: pwsh
        run: |
          $llvmUrl = "https://github.com/PLC-lang/llvm-package-windows/releases/download/v21.1.7/LLVM-21.1.7-win64.7z"
          $llvmArchive = "LLVM-21.1.7-win64.7z"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
          7z x $llvmArchive -o"./llvm" -y
          $llvmBin = (Resolve-Path "./llvm/bin").Path
          echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the host stdlib
        run: cargo build --release -p iec61131std

      - name: Build the wasm-only compiler
        run: cargo build --release --features plc-compiler/wasm-only

      - name: Upload plc.exe
        uses: actions/upload-artifact@v4
        with:
          name: plc.exe
          path: target/release/plc.exe

      - name: Upload iec61131std.dll
        uses: actions/upload-artifact@v4
        with:
          name: iec61131std.dll
          path: target/release/iec61131std.dll

      - name: Upload iec61131std.lib
        uses: actions/upload-artifact@v4
        with:
          name: iec61131std.lib
          path: target/release/iec61131std.lib

  bundle:
    name: Toolchain bundle
    runs-on: ubuntu-latest
    needs: [build, plc-exe]
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Assemble the bundle
        run: |
          mkdir -p rusty-x86_64-windows/lib/include
          mkdir -p rusty-x86_64-windows/lib/wasm32-unknown-unknown/debug
          mkdir -p rusty-x86_64-windows/lib/wasm32-unknown-unknown/release
          cp libs/stdlib/iec61131-st/*.st rusty-x86_64-windows/lib/include/
          cp dist/plc.exe rusty-x86_64-windows/plc.exe
          cp dist/libiec61131std.a rusty-x86_64-windows/lib/wasm32-unknown-unknown/release/libiec61131std.a
          cp dist/libiec61131std-debug.a rusty-x86_64-windows/lib/wasm32-unknown-unknown/debug/libiec61131std.a
          cp dist/iec61131std.wasm rusty-x86_64-windows/lib/wasm32-unknown-unknown/release/iec61131std.wasm
          tar -czf rusty-x86_64-windows.tar.gz rusty-x86_64-windows

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: rusty-x86_64-windows.tar.gz
          path: rusty-x86_64-windows.tar.gz

  pr-artifacts:
    name: PR Artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [bundle]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = artifacts.artifacts
              .map(a => `| \`${a.name}\` | [Download](${runUrl}/artifacts/${a.id}) | ${(a.size_in_bytes / 1024 / 1024).toFixed(1)} MB |`);

            const section = [
              '#### :wasm: MCU (WAMR)',
              '| Artifact | Link | Size |',
              '|----------|------|------|',
              ...lines,
              '',
              `_From [workflow run](${runUrl})_`,
            ].join('\n');

            const COMMENT_MARKER = '<!-- mcu-artifacts -->';
            const SECTION_START = '<!-- mcu-start -->';
            const SECTION_END = '<!-- mcu-end -->';
            const sectionBlock = `${SECTION_START}\n${section}\n${SECTION_END}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(COMMENT_MARKER));

            if (existing) {
              const re = new RegExp(`${SECTION_START}[\\s\\S]*?${SECTION_END}`);
              const body = re.test(existing.body)
                ? existing.body.replace(re, sectionBlock)
                : existing.body + '\n\n' + sectionBlock;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${COMMENT_MARKER}\n### Build Artifacts\n\n${sectionBlock}`,
              });
            }

  publish:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" dist/* --repo "${{ github.repository }}" --title "$VERSION" --generate-notes --target ${{ github.sha }}
