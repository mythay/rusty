# FORK(no_std): verifies the WAMR/MCU build path of libs/stdlib, which no other workflow covers.

name: MCU (WAMR) Build

on:
  push:
    branches: ["release/[0-9]*"]
  pull_request:
    branches: ["release/[0-9]*"]
  workflow_dispatch:

jobs:
  build:
    name: wasm32-unknown-unknown (mcu-wamr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      # The stdlib's build dependency compiles the IEC compiler for the host, so an
      # LLVM 21 installation must be reachable (LLVM_SYS_211_PREFIX or PATH).
      - name: Install LLVM 21
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev libpolly-21-dev

      - name: Build the stdlib for WAMR
        working-directory: libs/stdlib
        env:
          LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
        run: cargo mcu-release

      - name: Upload the wasm libraries
        uses: actions/upload-artifact@v4
        with:
          name: stdlib-wasm
          path: |
            target/wasm32-unknown-unknown/release/libiec61131std.a
            target/wasm32-unknown-unknown/release/iec61131std.wasm

  # The wasm-only compiler binary for Windows hosts, so the SDK does not have to be
  # built locally. The exe embeds only the WebAssembly backend.
  plc-exe:
    name: plc.exe (wasm-only, windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Install LLVM
        shell: pwsh
        run: |
          $llvmUrl = "https://github.com/PLC-lang/llvm-package-windows/releases/download/v21.1.7/LLVM-21.1.7-win64.7z"
          $llvmArchive = "LLVM-21.1.7-win64.7z"
          Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
          7z x $llvmArchive -o"./llvm" -y
          $llvmBin = (Resolve-Path "./llvm/bin").Path
          echo "$llvmBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the wasm-only compiler
        run: cargo build --release --features plc-compiler/wasm-only

      - name: Upload the compiler
        uses: actions/upload-artifact@v4
        with:
          name: plc-wasm-only-windows
          path: target/release/plc.exe

  pr-artifacts:
    name: PR Artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, plc-exe]
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const lines = artifacts.artifacts
              .map(a => `| \`${a.name}\` | [Download](${runUrl}/artifacts/${a.id}) | ${(a.size_in_bytes / 1024 / 1024).toFixed(1)} MB |`);

            const section = [
              '#### :wasm: MCU (WAMR)',
              '| Artifact | Link | Size |',
              '|----------|------|------|',
              ...lines,
              '',
              `_From [workflow run](${runUrl})_`,
            ].join('\n');

            const COMMENT_MARKER = '<!-- mcu-artifacts -->';
            const SECTION_START = '<!-- mcu-start -->';
            const SECTION_END = '<!-- mcu-end -->';
            const sectionBlock = `${SECTION_START}\n${section}\n${SECTION_END}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(COMMENT_MARKER));

            if (existing) {
              const re = new RegExp(`${SECTION_START}[\\s\\S]*?${SECTION_END}`);
              const body = re.test(existing.body)
                ? existing.body.replace(re, sectionBlock)
                : existing.body + '\n\n' + sectionBlock;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `${COMMENT_MARKER}\n### Build Artifacts\n\n${sectionBlock}`,
              });
            }
