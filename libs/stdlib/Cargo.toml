[package]
name = "iec61131std"
version = "1.1.0-dev"
edition = "2021"
license = "LGPL-3.0"
description = "IEC 61131-3 standard library implementation"

#[build-dependencies]
#glob.workspace = true
#
#[build-dependencies.plc_driver]
#path = "../../compiler/plc_driver"
#version = "1.1.0-dev"


[dev-dependencies.plc_driver]
path = "../../compiler/plc_driver"
version = "1.1.0-dev"

[dev-dependencies.plc_source]
path = "../../compiler/plc_source"
version = "1.1.0-dev"

[dev-dependencies.plc]
package = "plc-compiler"
path = "../.."
version = "1.1.0-dev"


[dependencies]
num = { version = "0.4", default-features = false, features = ["libm"] }
paste = "1.0.8"
log = { version = "0.4", default-features = false }
libm = "0.2"

[dev-dependencies]
libloading = "0.9"
tempfile.workspace = true
cc.workspace = true

[features]
default = ["mock_time"]
mock_time = []
debug = []

[lib]
crate-type = ["staticlib"]

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"